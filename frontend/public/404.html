<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Utensils Shop</title>
    <script type="text/javascript">
      // Get the path and query string without the hash
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/Utensils_shop/?/' + l.pathname.slice(14).split('/').slice(1).join('/') +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
